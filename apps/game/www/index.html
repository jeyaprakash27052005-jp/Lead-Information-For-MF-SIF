<html lang="en"><head><meta charset="utf-8">

<title>Investment Business by Mcube Academy</title>

<meta name="description" content="A money-habits board game by Mcube Academy.">

<style>
:root{color-scheme:light;--bg:#ffffff;--fg:#111827;--mut:#6b7280;--bd:#e5e7eb;--bd2:#d1d5db;--card:#ffffff;--soft:#f8fafc;--ac:#4F3CC9;--ach:#3f2fb0;--acs:#f3f1ff;--acfg:#fff;--mid:#ffffff;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--font:"Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Helvetica Neue",Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
h1{font:700 26px/1.2 var(--font);letter-spacing:-.02em;margin:6px 0 4px}
h3{font:600 15px var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 8px}
.sub,.foot{color:var(--mut);font-size:14px}
.board{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);aspect-ratio:1/1;width:100%;max-width:calc(100vh - 32px);max-width:calc(100dvh - 32px);margin:0 auto;container-type:inline-size;gap:3px;background:#eef0f4;padding:4px;border-radius:14px;border:1px solid var(--bd);box-shadow:var(--sh)}
.sq{position:relative;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px 12px;text-align:center;font-size:10.5px;font-size:clamp(9px,2.35cqi,16px);line-height:1.15;min-width:0;overflow:hidden;background:#fff;border-top:4px solid #94a3b8}
.sq b{font-weight:700}
.sq b{color:#111827;font-weight:600}.sq span{font-weight:700}.sq.g{border-top-color:#16a34a;background:linear-gradient(#f0fdf4,#fff 55%)}.sq.g span{color:#15803d}.sq.r{border-top-color:#dc2626;background:linear-gradient(#fef2f2,#fff 55%)}.sq.r span{color:#b91c1c}.sq.c{border-top-color:#d97706;background:linear-gradient(#fffbeb,#fff 55%)}.sq.c span{color:#b45309}.sq.n{border-top-color:#2563eb;background:linear-gradient(#eff6ff,#fff 55%)}.sq.n span{color:#1d4ed8}
.tk{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.tk i{width:11px;height:11px;width:clamp(10px,2.6cqi,20px);height:clamp(10px,2.6cqi,20px);border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.mid{grid-area:2/2/6/6;position:relative;overflow:hidden;background:var(--mid);border-radius:10px;border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:4px}
.mid>*{position:relative;z-index:1}.mid::before,.mid::after{position:absolute;bottom:2px;font-size:58px;line-height:1;opacity:.16;filter:grayscale(1);z-index:0}.mid::before{content:'\1F402';left:3px}.mid::after{content:'\1F43B';right:3px}.logo{display:block;width:120px;height:auto;border-radius:12px;border:1px solid var(--bd)}.mid .logo{width:76px;width:clamp(56px,17cqi,140px)}.mid::before,.mid::after{font-size:clamp(40px,13cqi,110px)}.mid button{font-size:clamp(15px,3cqi,20px);padding:clamp(10px,2cqi,14px) clamp(16px,4cqi,28px)}
.who{font-weight:700;font-size:14px;font-size:clamp(13px,3.2cqi,22px)}
.dice{width:46px;height:46px;width:clamp(42px,10cqi,76px);height:clamp(42px,10cqi,76px);font-size:clamp(22px,5.4cqi,40px)!important;border:1.5px solid var(--bd2);border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 24px var(--font);background:#fff;box-shadow:var(--sh)}
button{font:600 15px var(--font);border:1px solid transparent;border-radius:8px;padding:10px 18px;background:var(--ac);color:var(--acfg);cursor:pointer;min-height:44px;box-shadow:0 1px 2px rgba(16,24,40,.08);transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:var(--ach)}
button:disabled{opacity:.45}
button.alt{background:#fff;color:#344054;border:1px solid var(--bd2)}button.alt:hover:not(:disabled){background:var(--soft)}
button:focus-visible,input:focus-visible{outline:3px solid rgba(79,60,201,.35);outline-offset:2px}
.msg{margin-top:12px;border:1px solid var(--bd);border-left:4px solid #2563eb;border-radius:12px;padding:12px 14px;min-height:84px;background:#fff;box-shadow:var(--sh)}
.msg.g{border-left-color:#16a34a}.msg.r{border-left-color:#dc2626}.msg.c{border-left-color:#d97706}
.msg{display:flex;gap:12px;align-items:flex-start}.msg .em{font-size:28px;line-height:1;flex:none;width:52px;height:52px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center}.msg h2{font:700 18px/1.3 var(--font);margin:0 0 4px}.msg p{margin:0 0 5px;font-size:15px;line-height:1.5;color:#374151}.msg p b{font-weight:700}
.score{margin-top:12px;display:grid;gap:6px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font-size:15px;font-weight:600;background:#fff}
.pl.on{border-color:var(--ac);background:var(--acs);box-shadow:0 0 0 1px var(--ac)}
.pl i{width:14px;height:14px;border-radius:50%;flex:none}
.pl span{margin-left:auto;color:var(--mut);font-size:12.5px;font-weight:500;text-align:right}.pl span strong{color:var(--fg);font-size:15px;font-weight:700}
.pick{display:flex;gap:8px;margin:10px 0 16px}
.rules{padding-left:20px;font-size:15px}
.cc{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13.5px;line-height:1.3}
.cc div{display:flex;gap:6px}.cc b{flex:none;min-width:58px}
.p{color:#15803d}.m{color:#b91c1c}.a{color:#b45309}
label{display:block;font-weight:600;font-size:14px;color:#344054;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=email],input[type=password]{width:100%;font:16px var(--font);padding:10px 12px;border:1px solid var(--bd2);border-radius:8px;background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(16,24,40,.05)}
input:focus{border-color:var(--ac)}
.ck{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13.5px}
.ck input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--ac)}
.err{color:#b91c1c;font-weight:600;font-size:14px;margin:8px 0;min-height:20px}
.lead{width:100%;border-collapse:collapse;font-size:13.5px;margin:12px 0;background:#fff;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.lead td,.lead th{border-bottom:1px solid var(--bd);padding:8px 10px;text-align:left}.lead th{background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.no{flex:none;width:20px;height:20px;border-radius:50%;background:var(--acs);color:var(--ac);font:700 11px/20px var(--font);text-align:center;font-style:normal}
.win{text-align:center;border-radius:14px;padding:20px 16px;margin-top:12px;background:linear-gradient(#fffbeb,#fff);color:#78350f;border:1px solid #fcd34d;box-shadow:var(--sh)}.win .tr{font-size:64px;line-height:1}.win h2{font:700 20px var(--font);margin:4px 0}.win .big{font:800 28px var(--font);letter-spacing:-.02em;margin:0}.win p{margin:4px 0}
.prod{padding:0;list-style:none;margin:6px 0}.prod li{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;font-size:15px;background:#fff}
.slog{border:1px solid var(--bd);border-left:4px solid var(--ac);background:var(--soft);border-radius:10px;padding:6px 14px}.slog p{margin:8px 0;font-size:15px}
a.btn{display:inline-block;background:var(--ac);color:var(--acfg);padding:11px 18px;border-radius:8px;font-weight:600;text-decoration:none}
/* ---------- Layout that adapts to the device ---------- */
#app.s-play{max-width:1400px}#app.s-wide{max-width:960px}
.game{display:grid;gap:14px}.game .msg{margin-top:0}.game .score{margin-top:0}.now{display:grid;gap:12px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04)}
.home .pick button{flex:1}
.form h1{margin-top:10px}
/* Laptop, desktop, tablet landscape, phone landscape: board on the left, game info on the right */
@media (min-width:900px),(orientation:landscape) and (min-width:600px){
 .game{grid-template-columns:auto minmax(280px,1fr);align-items:start;gap:20px}
 .game .left{position:sticky;top:12px}
 .game .board{width:min(calc(100vh - 32px),calc(100vw - 380px),820px);width:min(calc(100dvh - 32px),calc(100vw - 380px),820px);max-width:none}
 .game .side{min-width:0;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
 .game .now{position:sticky;top:0;z-index:2;background:var(--bg);padding-bottom:10px;display:grid;gap:10px}
 .side .cc{grid-template-columns:1fr 1fr}
}
/* Phone landscape: very little height, so tighten the side panel */
@media (orientation:landscape) and (max-height:540px){
 #app.s-play{padding-top:8px;padding-bottom:8px}
 .game .left{top:8px}.game .side{max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}.now .score{grid-template-columns:1fr 1fr;gap:6px}.game .board{width:min(calc(100vh - 16px),calc(100vw - 340px));width:min(calc(100dvh - 16px),calc(100vw - 340px))}
 .game{grid-template-columns:auto minmax(240px,1fr)}
 .msg{min-height:0;padding:8px 10px}.msg .em{font-size:32px}.msg h2{font-size:17px}.msg p{font-size:14px}
 .pl{padding:6px 8px;font-size:14px}
}
/* Laptop and tablet: home screen in two columns */
@media (min-width:860px){
 #app.s-home{max-width:1040px}
 .home{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;min-height:calc(100vh - 60px);min-height:calc(100dvh - 60px)}
 .home h1{font-size:40px}
 #app.s-form{max-width:560px}.form{margin-top:4vh}
}
/* Big screens (classroom projector, large monitor): larger text */
@media (min-width:1600px) and (min-height:900px){body{font-size:18px}.msg h2{font-size:24px}.msg p{font-size:18px}.pl{font-size:17px}}
</style></head>
