  1. Admin page: open the page with #admin at the end of the link, or tap the Mcube logo 5 times. PIN is CONFIG.ADMIN_PIN below.
  2. Records are kept in the browser of the device the game is played on (best for one stall tablet/laptop).
  3. To collect every player from every phone into ONE Google Sheet, paste a Google Apps Script web-app URL in CONFIG.SHEET_URL.
     Apps Script (Extensions > Apps Script in your Google Sheet, then Deploy > Web app, access: Anyone):
       function doPost(e){
         var s=SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
         var d=JSON.parse(e.postData.contents);
         if(s.getLastRow()==0) s.appendRow(Object.keys(d));
         s.appendRow(Object.keys(d).map(function(k){return d[k];}));
         return ContentService.createTextOutput("ok");
       }

<style>
:root{
  --bg:#0b1a2b; --card:#ffffff; --ink:#132033; --muted:#5b6b80;
  --bull:#16a34a; --bear:#dc2626; --gold:#f5b301; --brand:#0f3d91; --brand2:#1d6fe0;
  --bank:#2563eb; --fd:#7c3aed; --goldc:#d4a017; --mf:#0d9488; --stocks:#ea580c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Poppins','Noto Sans Tamil','Latha','Nirmala UI',sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#14532d 0%,transparent 60%),radial-gradient(1000px 600px at 110% 10%,#7f1d1d 0%,transparent 55%),var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
html[lang="ta"] body{font-family:'Noto Sans Tamil','Latha','Nirmala UI','Poppins',sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 12px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.logo-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--brand2),var(--brand));display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;box-shadow:0 4px 14px rgba(29,111,224,.45)}
.logo-mark sup{font-size:10px;vertical-align:super;line-height:0}
.logo-txt{line-height:1.05}
.logo-txt b{display:block;white-space:nowrap;font-size:16px;letter-spacing:.3px}
.logo-txt span{font-size:11px;opacity:.8;letter-spacing:1.5px}
.ticker{flex:1;font-size:11px;color:#cfe;white-space:nowrap;overflow:hidden;max-width:46%}
.ticker span{display:inline-block;animation:tick 14s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}
.up{color:#4ade80}.dn{color:#f87171}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:14px}
h1.title{color:#fff;text-align:center;font-size:24px;line-height:1.25;margin:8px 0 4px}
h1.title .b{color:#4ade80}h1.title .r{color:#f87171}
.sub{color:#dbe7f5;text-align:center;font-size:14px;margin-bottom:16px}
.hero{display:flex;justify-content:center;gap:18px;font-size:46px;margin:6px 0 10px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--bull),#15803d);box-shadow:0 6px 16px rgba(22,163,74,.35)}
.btn:active{transform:translateY(1px)}
.btn.alt{background:linear-gradient(135deg,var(--brand2),var(--brand));box-shadow:0 6px 16px rgba(29,111,224,.35)}
.btn.ghost{background:#eef2f7;color:var(--ink);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:none}
.btn+.btn{margin-top:10px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input{width:100%;padding:13px 14px;border:2px solid #dbe3ee;border-radius:12px;font:inherit;font-size:16px;outline:none}
input:focus{border-color:var(--brand2)}
.err{color:var(--bear);font-size:13px;margin-top:10px;min-height:18px;font-weight:600}
.hidden{display:none!important}
/* game */
.tigers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tcard{background:#fff1f1;border:2px solid #fecaca;border-radius:12px;padding:6px 4px;text-align:center;font-size:12px;font-weight:600;line-height:1.25;transition:.3s}
.tcard .em{font-size:20px;display:block}
.tcard.trap{background:#ecfdf5;border-color:#86efac;color:#166534}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:#f3f6fb;border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted)}
.stat.loss b{color:var(--bear)}
.msg{border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:10px;background:#eef6ff;color:#0f3d91;min-height:44px;display:flex;align-items:center;gap:8px;transition:background .3s}
.msg.bad{background:#fff1f1;color:#b91c1c}
.msg.good{background:#ecfdf5;color:#166534}
.boardbox{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#dcfce7 0%,#f8fafc 48%,#fee2e2 100%);border:3px solid #0f3d91}
svg#board{display:block;width:100%;height:auto;touch-action:manipulation}
.next{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;margin-top:10px;font-weight:600}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px #0002}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.rules h3{font-size:16px;margin-bottom:8px}
.rules ol{padding-left:20px;font-size:14px;line-height:1.6}
.rules li{margin-bottom:4px}
/* result */
.big{text-align:center}
.big .emoji{font-size:56px}
.big h2{font-size:22px;margin:4px 0}
.big p{color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:#f3f6fb;border-radius:14px;padding:12px;text-align:center}
.kpi span{font-size:12px;color:var(--muted);display:block}
.kpi b{font-size:20px}
.kpi.hl{grid-column:1/-1;background:linear-gradient(135deg,#ecfdf5,#dcfce7);border:2px solid #86efac}
.kpi.hl b{font-size:40px;color:#15803d}
.kpi.mat b{font-size:28px;color:var(--brand)}
.sec-t{font-size:17px;font-weight:800;margin-bottom:10px}
.arow{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.bar{height:14px;background:#e5e7eb;border-radius:8px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid #edf1f6;text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tfoot td{font-weight:800}
.points{list-style:none}
.points li{position:relative;padding:8px 0 8px 30px;font-size:14px;line-height:1.55;border-bottom:1px dashed #e5eaf1}
.points li:last-child{border-bottom:0}
.points li::before{content:attr(data-n);position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:50%;background:var(--brand2);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:700}
.early{background:#fff8e6;border:2px dashed var(--gold);border-radius:14px;padding:12px;font-size:14px;line-height:1.55;margin-top:12px}
.mcube{background:linear-gradient(135deg,#0f3d91,#1d6fe0);color:#fff}
.mcube .sec-t{color:#fff}
.mcube ul{padding-left:18px;font-size:14px;line-height:1.7}
.mcube .contact{margin-top:10px;font-size:14px}
.mcube a{color:#ffe08a}
.disc{font-size:11.5px;color:#cbd5e1;text-align:center;line-height:1.5;padding:4px 10px 14px}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,12,24,.7);display:grid;place-items:center;z-index:50;padding:20px}
.ov .card{max-width:380px;width:100%;text-align:center}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
/* admin */
.adm-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.adm-tools .btn{width:auto;flex:1;min-width:120px;font-size:14px;padding:10px}
.adm-tools .btn+.btn{margin-top:0}
.admtbl{width:100%;border-collapse:collapse;font-size:12px}
.admtbl th,.admtbl td{border-bottom:1px solid #edf1f6;padding:6px 4px;text-align:left;vertical-align:top}
.admtbl th{background:#f3f6fb;position:sticky;top:0}
.scroll{overflow:auto;max-height:65vh}
.x{border:0;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:4px 8px;font-weight:700;cursor:pointer}
textarea{width:100%;min-height:120px;font-size:11px;border:1px solid #dbe3ee;border-radius:10px;padding:8px;margin-top:8px}
/* Mcube Games: light theme and layout for every screen size */
body{background:#f6f8fb!important;color-scheme:light}
h1.title{color:var(--ink)}h1.title .b{color:#15803d}h1.title .r{color:#b91c1c}
.sub{color:var(--muted)}.top{color:var(--ink)}.ticker{color:#334155}.ticker .up{color:#15803d}.ticker .dn{color:#b91c1c}
.disc{color:var(--muted)}
.card{box-shadow:0 1px 3px rgba(16,24,40,.08);border:1px solid #e5e7eb}
.btn{border-radius:10px;box-shadow:none;font-weight:600}
.btn.alt{background:#4F3CC9}.btn:not(.alt):not(.ghost):not(.red){background:#15803d}
.logo{cursor:default}
.boardbox{max-width:calc((100dvh - 330px)*1.217);min-width:min(100%,300px);margin:0 auto}
@media (min-width:1000px){.wrap{max-width:1120px}
 #sGame{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:16px;align-items:start}
 #sGame>.card{margin-bottom:0}.boardbox{max-width:calc((100dvh - 430px)*1.217)}
 #sLang,#sReg,#sRes{max-width:640px;margin:0 auto}}
</style>
</head>

let player=null;
$('regForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('fName').value.trim(), mob=$('fMob').value.replace(/\D/g,''), age=parseInt($('fAge').value,10);
  const err=$('regErr');
  if(name.length<2){err.textContent=t('eName');return;}
  if(!/^[6-9]\d{9}$/.test(mob)){err.textContent=t('eMob');return;}
  if(!(age>=8&&age<=100)){err.textContent=t('eAge');return;}
  const recs=loadRecs();
  if(recs.some(r=>r.mobile===mob)){err.textContent=t('eDup');return;}
  err.textContent='';const sb=$('regForm').querySelector('[type=submit]');sb.disabled=true;
  MG.register('aadupuli',{name,mobile:mob,age,lang:L}).then(rr=>{sb.disabled=false;
    if(rr.dup){err.textContent=t('eDup');return;}
    player={id:Date.now().toString(36),mgId:rr.id,name,mobile:mob,age,lang:L,date:new Date().toLocaleString('en-IN'),status:'started'};
    recs.push(player);saveRecs(recs);
    startGame();
  });
});

/* ================= BOARD GEOMETRY (23 points) ================= */
const P=[]; const addPt=(x,y)=>{P.push({x,y});return P.length-1;};
const CX=210, RY=[20,112,182,252,320], OFF=[-180,-60,60,180];
const fac=r=>(RY[r]-RY[0])/(RY[4]-RY[0]);
const apex=addPt(CX,RY[0]); const rows=[];
for(let r=1;r<=3;r++){const row=[addPt(24,RY[r])];OFF.forEach(o=>row.push(addPt(CX+o*fac(r),RY[r])));row.push(addPt(396,RY[r]));rows[r]=row;}
rows[4]=OFF.map(o=>addPt(CX+o,RY[4]));
const LINES=[];
for(let j=0;j<4;j++)LINES.push([apex,rows[1][j+1],rows[2][j+1],rows[3][j+1],rows[4][j]]);
for(let r=1;r<=4;r++)LINES.push(rows[r]);
LINES.push([rows[1][0],rows[2][0],rows[3][0]]);LINES.push([rows[1][5],rows[2][5],rows[3][5]]);
const ADJ=P.map(()=>new Set()); const JUMPS=P.map(()=>[]);
LINES.forEach(Ln=>{for(let k=0;k<Ln.length-1;k++){ADJ[Ln[k]].add(Ln[k+1]);ADJ[Ln[k+1]].add(Ln[k]);}
  for(let k=0;k<Ln.length-2;k++){JUMPS[Ln[k]].push({over:Ln[k+1],to:Ln[k+2]});JUMPS[Ln[k+2]].push({over:Ln[k+1],to:Ln[k]});}});

  [apex,rows[1][2],rows[1][3]].forEach((p,i)=>{G.tigers.push({pos:p,i});G.board[p]='T'+i;});
  buildBoard();applyLang();renderRules();show('sGame');update();setMsg(t('place'));
}

const NS='http://www.w3.org/2000/svg';

let layerHint,layerPieces,pieceEls={};
function buildBoard(){
  const svg=$('board');svg.innerHTML='';pieceEls={};
  // background: candles + bull/bear
  const bg=el('g',{},svg);
  for(let i=0;i<14;i++){const x=10+i*29.5,h=10+((i*37)%22),up=(i*7)%3!==0,y=338-h;
    el('line',{x1:x+4,x2:x+4,y1:y-5,y2:y+h+3,stroke:up?'#16a34a':'#dc2626','stroke-width':1.2,opacity:.35},bg);
    el('rect',{x,y,width:8,height:h,rx:1.5,fill:up?'#16a34a':'#dc2626',opacity:.28},bg);}
  const tb=el('text',{x:40,y:70,'font-size':54,opacity:.18,'text-anchor':'middle'},bg);tb.textContent='🐂';
  const tr=el('text',{x:380,y:70,'font-size':54,opacity:.18,'text-anchor':'middle'},bg);tr.textContent='🐻';
  const lb1=el('text',{x:40,y:96,'font-size':11,'font-weight':800,fill:'#15803d','text-anchor':'middle',opacity:.6},bg);lb1.textContent='BULL';
  const lb2=el('text',{x:380,y:96,'font-size':11,'font-weight':800,fill:'#b91c1c','text-anchor':'middle',opacity:.6},bg);lb2.textContent='BEAR';
  // lines
  const lg=el('g',{stroke:'#0f3d91','stroke-width':3,'stroke-linecap':'round',fill:'none'},svg);
  LINES.forEach(Ln=>{const a=P[Ln[0]],b=P[Ln[Ln.length-1]];el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y},lg);});
  // points
  const pg=el('g',{},svg);
  P.forEach((p,i)=>el('circle',{cx:p.x,cy:p.y,r:7,fill:'#fff',stroke:'#0f3d91','stroke-width':2.5},pg));
  layerHint=el('g',{},svg);
  layerPieces=el('g',{},svg);
  svg.onclick=onBoardClick;
}

  const e=el('g',{},layerPieces);e.style.transition='transform .5s ease';
  el('circle',{r:17,fill:'#f97316',stroke:'#7c2d12','stroke-width':3},e);
  const tx=el('text',{y:6,'font-size':18,'text-anchor':'middle'},e);tx.textContent='🐯';
  const badge=el('g',{},e);el('circle',{cx:13,cy:-13,r:7.5,fill:'#7c2d12'},badge);
  const n=el('text',{x:13,y:-9.5,'font-size':10,'font-weight':800,fill:'#fff','text-anchor':'middle'},badge);n.textContent=ti+1;
  pieceEls['t'+ti]=e;piecePos(e,G.tigers[ti].pos);
}

/* ================= RULE ENGINE ================= */
const isGoat=v=>typeof v==='number';
function tigerMovesOf(ti){const pos=G.tigers[ti].pos,res=[];
  ADJ[pos].forEach(n=>{if(G.board[n]===null)res.push({ti,from:pos,to:n});});
  JUMPS[pos].forEach(j=>{if(isGoat(G.board[j.over])&&G.board[j.to]===null)res.push({ti,from:pos,to:j.to,cap:j.over});});
  return res;}
const allTigerMoves=()=>G.tigers.flatMap((_,i)=>tigerMovesOf(i));
function goatMovesFrom(p){return [...ADJ[p]].filter(n=>G.board[n]===null);}
function anyGoatMove(){return G.goats.some(g=>!g.lost&&goatMovesFrom(g.pos).length);}

/* ================= UI UPDATE ================= */
function update(){
  $('tigerCards').innerHTML=G.tigers.map((tg,i)=>{const trapped=tigerMovesOf(i).length===0;
    return `<div class="tcard ${trapped?'trap':''}"><span class="em">${trapped?'🔒':'🐯'} ${i+1}</span>${t('tigers')[i]}<br><small>${trapped?t('trapped'):t('active')}</small></div>`;}).join('');
  $('stHand').textContent=15-G.placed;$('stLost').textContent=G.lost;
  $('stMoves').textContent=`${G.moves}/${CONFIG.MAX_GOAT_MOVES}`;
  if(!pieceEls.t0)G.tigers.forEach((_,i)=>makeTigerEl(i));
  if(G.phase==='place'){const a=ASSETS[G.placed%5];$('nextGoat').innerHTML=`${t('nextGoat')} <i class="dot" style="background:${ACOL[a]}"></i> ${t('assets')[a]} (₹1,000)`;}
  else $('nextGoat').innerHTML='';
  drawHints();
}
function drawHints(){
  layerHint.innerHTML='';if(!G||G.phase==='over')return;
  // exposed goats
  const caps=allTigerMoves().filter(m=>m.cap!==undefined);
  caps.forEach(m=>el('circle',{cx:P[m.cap].x,cy:P[m.cap].y,r:21,fill:'none',stroke:'#dc2626','stroke-width':3,'stroke-dasharray':'4 3'},layerHint));
  if(G.sel!==null){
    el('circle',{cx:P[G.sel].x,cy:P[G.sel].y,r:21,fill:'none',stroke:'#f5b301','stroke-width':4},layerHint);
    goatMovesFrom(G.sel).forEach(n=>{const c=el('circle',{cx:P[n].x,cy:P[n].y,r:13,fill:'#f5b301',opacity:.75},layerHint);
      c.animate([{opacity:.35},{opacity:.9}],{duration:700,iterations:Infinity,direction:'alternate'});});
  }
}
function setMsg(text,kind){const m=$('msg');m.textContent=text;m.className='msg'+(kind?' '+kind:'');}
function yourTurnMsg(){
  const exposed=allTigerMoves().some(m=>m.cap!==undefined);
  setMsg((G.phase==='place'?t('place'):t('move'))+(exposed?' '+t('exposed'):''),exposed?'bad':'');
}

/* ================= INPUT ================= */
function onBoardClick(ev){
  if(!G||G.busy||G.phase==='over')return;
  const svg=$('board');const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;
  const sp=pt.matrixTransform(svg.getScreenCTM().inverse());
  let best=-1,bd=30;P.forEach((p,i)=>{const d=Math.hypot(p.x-sp.x,p.y-sp.y);if(d<bd){bd=d;best=i;}});
  if(best<0)return;
  if(G.phase==='place'){
    if(G.board[best]!==null)return;
    const gi=G.goats.length;G.goats.push({asset:ASSETS[gi%5],pos:best,lost:false});
    G.board[best]=gi;G.placed++;makeGoatEl(gi);
    if(G.placed===15)G.phase='move';
    afterGoat();
  }else{
    const v=G.board[best];
    if(isGoat(v)){ if(!goatMovesFrom(best).length){G.sel=null;setMsg(t('noMoveGoat'),'bad');drawHints();return;}
      G.sel=best;setMsg(t('pick'));drawHints();return;}
    if(v===null&&G.sel!==null&&ADJ[G.sel].has(best)){
      const gi=G.board[G.sel];G.board[G.sel]=null;G.board[best]=gi;G.goats[gi].pos=best;piecePos(pieceEls['g'+gi],best);
      G.sel=null;G.moves++;afterGoat();
    }
  }
}
function afterGoat(){
  G.turn++;update();
  const tm=allTigerMoves();
  let special=null;
  // newly trapped tigers
  G.tigers.forEach((_,i)=>{const tr=tigerMovesOf(i).length===0;if(tr&&!G.trapSeen.has(i)){G.trapSeen.add(i);special=t('trapMsg')(t('tigers')[i]);}if(!tr)G.trapSeen.delete(i);});
  if(!tm.length){return finish('win');}
  // diversification message: a tiger next to a goat that is protected (landing blocked)
  const protectedNow=G.tigers.some(tg=>JUMPS[tg.pos].some(j=>isGoat(G.board[j.over])&&G.board[j.to]!==null));
  const anyCap=tm.some(m=>m.cap!==undefined);
  if(!special&&protectedNow&&!anyCap&&G.turn-G.groupShown>=5){G.groupShown=G.turn;special=t('group');}
  G.busy=true;
  if(special)setMsg(special,'good');else setMsg(t('think'));
  setTimeout(tigerTurn,special?1600:650);
}
function tigerTurn(){
  const tm=allTigerMoves();if(!tm.length){G.busy=false;return finish('win');}
  const caps=tm.filter(m=>m.cap!==undefined);
  // EASY mode: capture when possible, otherwise a random move
  const mv=caps.length?caps[Math.floor(Math.random()*caps.length)]:tm[Math.floor(Math.random()*tm.length)];
  const tg=G.tigers[mv.ti];G.board[mv.from]=null;G.board[mv.to]='T'+mv.ti;tg.pos=mv.to;piecePos(pieceEls['t'+mv.ti],mv.to);
  let captured=false;
  if(mv.cap!==undefined){const gi=G.board[mv.cap];G.board[mv.cap]=null;G.goats[gi].lost=true;G.lost++;captured=true;
    const e=pieceEls['g'+gi];e.style.opacity='0';setTimeout(()=>e.remove(),500);
    setMsg(t('capture')(t('tigers')[mv.ti],t('assets')[G.goats[gi].asset]),'bad');
    flashLoss(P[mv.cap]);}
  G.tigers.forEach((_,i)=>{if(tigerMovesOf(i).length)G.trapSeen.delete(i);});
  update();
  setTimeout(()=>{
    G.busy=false;
    if(G.lost>=CONFIG.MAX_LOST)return finish('lose','lost');
    if(!allTigerMoves().length)return finish('win');
    if(G.phase==='move'&&G.moves>=CONFIG.MAX_GOAT_MOVES)return finish('lose','moves');
    if(G.phase==='move'&&!anyGoatMove())return finish('lose','stuck');
    if(!captured)yourTurnMsg();
  },captured?1300:500);
}
function flashLoss(p){const g=el('g',{},layerPieces);const tx=el('text',{x:p.x,y:p.y-22,'font-size':14,'font-weight':800,fill:'#dc2626','text-anchor':'middle'},g);tx.textContent='-₹1,000';
  g.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-20px)',opacity:0}],{duration:1300,fill:'forwards'});setTimeout(()=>g.remove(),1350);}

/* ================= RESULT ================= */
function sipFV(m,ratePct,yrs){const i=ratePct/1200,n=yrs*12;if(i===0)return m*n;return m*((Math.pow(1+i,n)-1)/i)*(1+i);}
function solveRate(m,yrs,target){let lo=0,hi=40;for(let k=0;k<80;k++){const mid=(lo+hi)/2;if(sipFV(m,mid,yrs)<target)lo=mid;else hi=mid;}return (lo+hi)/2;}
function finish(res,why){
  if(G.phase==='over')return;G.phase='over';G.end={res,why};G.sel=null;drawHints();update();
  setMsg(res==='win'?'🏆':'🐯',res==='win'?'good':'bad');
  setTimeout(()=>showResult(res,why),1100);
}
function showResult(res,why){
  const alive=G.goats.filter(g=>!g.lost); const notPlaced=15-G.goats.length; // goats never placed are still safe money
  const cnt={};ASSETS.forEach(a=>cnt[a]=alive.filter(g=>g.asset===a).length);
  for(let k=0;k<notPlaced;k++)cnt[ASSETS[(G.goats.length+k)%5]]++;
  const left=15-G.lost, saved=left*1000;
  const till=player.age<CONFIG.GOAL_AGE; const yrs=till?CONFIG.GOAL_AGE-player.age:CONFIG.OVER_AGE_YEARS;
  let mat=0;const rowsH=ASSETS.filter(a=>cnt[a]).map(a=>{const m=cnt[a]*1000,v=sipFV(m,RATES[a],yrs);mat+=v;
    return `<tr><td><i class="dot" style="background:${ACOL[a]}"></i> ${t('assets')[a]}</td><td>₹${fmt(m)}</td><td>₹${fmt(v)}</td></tr>`;}).join('');
  const invested=saved*12*yrs, avg=solveRate(saved,yrs,mat);
  let matE=0;ASSETS.forEach(a=>{if(cnt[a])matE+=sipFV(cnt[a]*1000,RATES[a],yrs+5);});
  const head=res==='win'?t('winH')(esc(player.name)):t('loseH')(esc(player.name));
  const whyTxt=res==='win'?'':({lost:t('loseWhyLost'),moves:t('loseWhyMoves'),stuck:t('loseWhyStuck')}[why]||'');
  const bars=ASSETS.map(a=>`<div class="arow"><span><i class="dot" style="background:${ACOL[a]}"></i> ${t('assets')[a]}</span><div class="bar"><i style="width:${cnt[a]/3*100}%;background:${ACOL[a]}"></i><i style="width:${(3-cnt[a])/3*100}%;background:#fca5a5"></i></div><b>${cnt[a]}/3</b></div>`).join('');
  const contact=(CONFIG.MCUBE_WEBSITE?`<div>${t('web')}: <a href="${CONFIG.MCUBE_WEBSITE}" target="_blank" rel="noopener">${CONFIG.MCUBE_WEBSITE}</a></div>`:'')+(CONFIG.MCUBE_PHONE?`<div>${t('phone')}: <a href="tel:${CONFIG.MCUBE_PHONE.replace(/\s/g,'')}">${CONFIG.MCUBE_PHONE}</a> (${CONFIG.MCUBE_PHONE})</div>`:'')+(CONFIG.MCUBE_ADDRESS?`<div>📍 ${CONFIG.MCUBE_ADDRESS}</div>`:'');
  $('sRes').innerHTML=`
   <div class="card big pop"><div class="emoji">${res==='win'?'🏆':'🐯'}</div><h2>${head}</h2><p>${whyTxt}</p>
     <div class="kpis"><div class="kpi"><span>${t('saved')}</span><b style="color:#15803d">₹${fmt(saved)}</b><span>${t('of')}</span></div>
     <div class="kpi"><span>🐐</span><b>${left}/15</b><span>${t('goatsLeft')(left)}</span></div></div></div>
   <div class="card"><div class="sec-t">${t('survT')}</div>${bars}</div>
   <div class="card"><div class="sec-t">📈 ${t('sipT')}</div><p style="font-size:14px;line-height:1.55">${t('sipLine')(fmt(saved),yrs,till)}</p>
     <div class="kpis"><div class="kpi"><span>${t('invested')}</span><b>₹${fmt(invested)}</b></div>
     <div class="kpi mat"><span>${t('becomes')}</span><b>₹${fmt(mat)}</b></div>
     <div class="kpi hl"><span>${t('avg')}</span><b>${avg.toFixed(2)}%</b></div></div>
     <table class="tbl" style="margin-top:14px"><thead><tr><th>${t('thA')}</th><th>${t('thM')}</th><th>${t('thV')} ${yrs} ${t('yrs')}</th></tr></thead><tbody>${rowsH}</tbody>
     <tfoot><tr><td>${t('total')}</td><td>₹${fmt(saved)}</td><td>₹${fmt(mat)}</td></tr></tfoot></table>
     <div class="early">${t('steady')}</div>
     <div class="early">${t('early')(yrs+5,fmt(matE),fmt(matE-mat))}</div></div>
   <div class="card"><div class="sec-t">🎓 ${t('lessT')}</div><ul class="points">${t('lessons').map((x,i)=>`<li data-n="${i+1}">${x}</li>`).join('')}</ul></div>
   <div class="card"><div class="sec-t">🐯 ${t('riskT')}</div><ul class="points">${t('risks').map((x,i)=>`<li data-n="${i+1}"><b>${t('tigers')[i]}:</b> ${x}</li>`).join('')}</ul></div>
   <div class="card mcube"><div class="sec-t">${t('mcT')}</div><ul>${t('mcList').map(x=>`<li>${x}</li>`).join('')}</ul>${contact?`<div class="contact">${contact}</div>`:''}</div>
   <button class="btn alt" id="btnNext">${t('newPlayer')}</button>
   <p class="disc" style="margin-top:14px">${t('disc')}</p>`;
  $('btnNext').onclick=()=>{$('regForm').reset();player=null;G=null;show('sLang');};
  show('sRes');
  // save record
  const recs=loadRecs();const r=recs.find(x=>x.id===player.id)||player;
  Object.assign(r,{status:'finished',result:res==='win'?'WIN':'LOSE',goatsLeft:left,savedRs:saved,
    lostAssets:ASSETS.map(a=>`${a}:${3-cnt[a]}`).join(' '),years:yrs,investedRs:Math.round(invested),maturityRs:Math.round(mat),avgReturnPct:avg.toFixed(2),goatMoves:G.moves});
  if(!recs.includes(r))recs.push(r);saveRecs(recs);sendSheet(r);
  MG.finish(player.mgId,res==='win'?'WIN':'LOSE',saved,{goatsLeft:left,savedRs:saved,lostAssets:r.lostAssets,sipYears:yrs,maturityRs:Math.round(mat),avgReturnPct:Number(avg.toFixed(2)),goatMoves:G.moves,language:L==='ta'?'Tamil':'English'});
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ================= ADMIN ================= */
const COLS=['date','name','mobile','age','lang','status','result','goatsLeft','savedRs','lostAssets','years','investedRs','maturityRs','avgReturnPct','goatMoves'];
let lastScreen='sLang';
function openAdmin(){lastScreen=screens.find(s=>!$(s).classList.contains('hidden'))||'sLang';if(lastScreen==='sAdmin')lastScreen='sLang';
  $('admLogin').classList.remove('hidden');$('admPanel').classList.add('hidden');$('admPin').value='';$('admErr').textContent='';show('sAdmin');}
function closeAdmin(){try{if(location.hash==='#admin')history.replaceState(null,'',location.pathname+location.search);}catch(e){}show(lastScreen);}
/* Organizer records are in the Mcube Game Admin site now. */

$('admGo').onclick=()=>{if($('admPin').value===CONFIG.ADMIN_PIN){$('admLogin').classList.add('hidden');$('admPanel').classList.remove('hidden');renderAdmin();}else $('admErr').textContent='Wrong PIN';};
$('admExit').onclick=closeAdmin;$('admExit1').onclick=closeAdmin;
function csv(){const recs=loadRecs();const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;return [COLS.join(','),...recs.map(r=>COLS.map(c=>q(r[c])).join(','))].join('\n');}
function renderAdmin(){const recs=loadRecs();$('admCount').textContent=recs.length;$('admNote').textContent='';$('admCsvBox').classList.add('hidden');
  $('admTbl').innerHTML=`<thead><tr><th></th>${COLS.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${recs.slice().reverse().map(r=>`<tr><td><button class="x" data-del="${r.id}">✕</button></td>${COLS.map(c=>`<td>${esc(r[c]??'')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${COLS.length+1}">No players yet.</td></tr>`}</tbody>`;
  $('admTbl').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmBox('Delete this player record?',()=>{saveRecs(loadRecs().filter(r=>r.id!==b.dataset.del));renderAdmin();}));}
$('admClear').onclick=()=>confirmBox('Delete ALL player records? This cannot be undone.',()=>{saveRecs([]);renderAdmin();});
$('admCsv').onclick=()=>{try{const b=new Blob(['﻿'+csv()],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='aadu-puli-players.csv';document.body.appendChild(a);a.click();a.remove();
  $('admNote').textContent='If no file downloaded (preview mode), use Copy CSV.';}catch(e){$('admNote').textContent='Download blocked here – use Copy CSV.';}};
$('admCopy').onclick=async()=>{const s=csv();const box=$('admCsvBox');box.value=s;box.classList.remove('hidden');
  try{await navigator.clipboard.writeText(s);$('admNote').textContent='Copied. Paste into Excel / Google Sheets.';}catch(e){box.select();$('admNote').textContent='Select the text below and copy it.';}};
function confirmBox(text,yes){$('ovCard').innerHTML=`<p style="font-weight:600;margin-bottom:14px">${text}</p><button class="btn red" id="cY">Delete</button><button class="btn ghost" id="cN">Cancel</button>`;
  $('ov').classList.remove('hidden');$('cY').onclick=()=>{$('ov').classList.add('hidden');yes();};$('cN').onclick=()=>$('ov').classList.add('hidden');}

/* ================= INIT ================= */

</script>
