ொடர்ந்தால்தான் கூட்டு வளர்ச்சி வேலை செய்யும்.`,why5:`எல்லாவற்றையும் ஒரே இடத்தில் போடுவது சூதாட்டம்; பிரித்துப் போடுவது திட்டம்.`,learnT:`நீங்கள் கற்றுக்கொள்ளக்கூடியவை`,l1:`சீக்கிரம் தொடங்குங்கள். காலமே கூட்டு வளர்ச்சிக்கு சக்தி.`,l2:`ஒவ்வொரு மாதமும் SIP மூலம் முதலீடு செய்யுங்கள், சிறிய தொகையானாலும்.`,l3:`பணத்தை வங்கி, NPS, பத்திரங்கள், மியூச்சுவல் ஃபண்ட், பங்குகளில் பிரித்துப் போடுங்கள்.`,l4:`நீண்ட காலம் முதலீட்டில் இருங்கள்; சந்தை சரிந்தால் நிறுத்த வேண்டாம்.`,l5:`நீங்களே முதலீடு செய்யத் தொடங்குவது எப்படி என்று Mcube Academy-இடம் கேளுங்கள்.`,capH:`விதை எடுப்பு {0}: {2}-இல் {1} விதைகள்`,capA:`ஒவ்வொரு மாதமும் {0}, {1} ஆண்டுகள்`,capB:`நீங்கள் போட்டது {0}. அது {1} ஆகும்.`,capR:`சராசரி வருமானம் ஆண்டுக்கு {0}%`,totT:`உங்கள் மொத்தம்`,totSip:`மொத்த மாதாந்திர SIP: {0}`,putL:`நீங்கள் போட்ட மொத்தம்`,becL:`அது ஆகும்`,gainL:`உங்கள் லாபம்`,avgL:`CAGR (ஆண்டு வருமானம், கூட்டு வளர்ச்சியுடன்)`,roiL:`முதலீட்டு வருமானம் (ROI)`,contT:`தொடர்ந்து முதலீடு செய்வதன் பலன்`,colYrs:`ஆண்டுகள்`,colVal:`மதிப்பு`,cont1:`முதல் 5 ஆண்டுகளில் உங்கள் பணம் {0} வளர்ந்தது. கடைசி 5 ஆண்டுகளில் {1} வளர்ந்தது. நீண்ட காலம் தொடர்ந்தால் வளர்ச்சி வேகமாகும்.`,cont2:`10 ஆண்டுகளில் நிறுத்தியிருந்தால் உங்களிடம் {0} இருக்கும். {1} ஆண்டுகள் தொடர்ந்தால் {2} கிடைக்கும்.`,noSips:`சுற்று 2-இல் நீங்கள் விதை வெல்லவில்லை.`,aBond:`பத்திரங்கள் (Bonds)`,avgNote:`இந்த ஒரு எண் உங்கள் எல்லா சொத்துகளின் கூட்டு வளர்ச்சியையும் சேர்த்துக் காட்டுகிறது. பல சொத்துகளில் பிரித்துப் போடுவது பாதுகாப்பையும் வளர்ச்சியையும் சமநிலைப்படுத்தி, காலப்போக்கில் உங்கள் பணம் அதிகம் சம்பாதிக்க உதவும்.`,

r1:`ஒவ்வொரு குழியிலும் 5 விதைகளுடன் தொடங்குங்கள். 1 விதை = ₹1,000. உங்கள் பக்கத்தின் ஒளிரும் குழிகளில் ஒன்றைத் தொடுங்கள்; அதன் விதைகள் அடுத்தடுத்த குழிகளில் ஒவ்வொன்றாக விழும்.`,

r3:`அடுத்த குழி காலியாக இருந்தால், அதற்கு அடுத்த குழியின் விதைகளை உங்கள் சேமிப்புப் பெட்டகத்தில் எடுத்துக்கொள்ளுங்கள்; உங்கள் முறை முடியும். அதுவும் காலியாக இருந்தால் எதுவும் கிடைக்காது.`,
r4:`சரியாக 4 விதைகள் வரும் குழி (பசு), யார் போட்டாலும், அந்தக் குழி எந்த வீரரின் பக்கத்தில் உள்ளதோ அவரது சேமிப்புப் பெட்டகத்துக்குப் போகும்.`,
r5:`எல்லா விதைகளும் ஒரே பக்கத்துக்கு வந்தால் சுற்று முடியும். ஒரு பக்கத்தில் மீதமுள்ள விதைகள் அதன் உரிமையாளருக்கு. தொடர்ந்து 60 முறை விதை எதுவும் எடுக்கப்படாவிட்டாலும் சுற்று முடியும்.`,
r6:`சுற்று 2 எப்போதும் விளையாடப்படும். உங்கள் சேமிப்புப் பெட்டகத்திலிருந்து உங்கள் ஒவ்வொரு குழியிலும் 5 விதைகள் போடப்படும். 5-க்கும் குறைவான குழி பேங்க்: அதில் அதன் உரிமையாளர் மட்டுமே விதை சேர்க்கலாம், யாரும் அதிலிருந்து விளையாட முடியாது. காலிக் குழிகள் மூடப்படும்; அவற்றிலும், மற்றவரின் பேங்கிலும் விதை விழாது.`,
r7:`சுற்று 1-இல் நீங்கள் வெல்லும் விதைகள் சுற்று 2-இல் உங்கள் குழிகளை நிரப்பும். சுற்று 2-இல் நீங்கள் விதைகளை எடுக்கும் ஒவ்வொரு முறையும், அவை தானாக உங்களுக்காக மாதாந்திர SIP ஆக முதலீடு செய்யப்படும். ஆட்டம் முடிந்ததும் உங்கள் முடிவு உடனே தெரியும்.`,
r8:`உங்கள் வயதே உங்கள் SIP எத்தனை ஆண்டுகள் தொடரும் என்பதை முடிவு செய்யும். சிறந்த சராசரி ஆண்டு வருமானம் பெற்றவர் வெற்றியாளர்.`

var regBusy=false;
async function doRegister(){
 if(regBusy)return;
 var P=[0,1].map(function(k){var ph=$('rp'+k).value.replace(/\D/g,'');if(ph.length===12&&ph.indexOf('91')===0)ph=ph.slice(2);return{name:$('rn'+k).value.trim(),age:parseInt($('ra'+k).value,10),phone:ph,email:$('re'+k).value.trim().toLowerCase()}});
 var err='',k;
 for(k=0;k<2&&!err;k++){
  if(!P[k].name)err=t('eName',k+1);
  else if(!(P[k].age>=10&&P[k].age<=90))err=t('eAge',k+1);
  else if(!/^[6-9]\d{9}$/.test(P[k].phone))err=t('ePhone',k+1);
  else if(!/^\S+@\S+\.\S+$/.test(P[k].email))err=t('eEmail',k+1);
 }
 if(!err&&(P[0].phone===P[1].phone||P[0].email===P[1].email))err=t('eSame');
 if(err){$('rerr').textContent=err;return}
 regBusy=true;$('rerr').textContent=t('checking');
 for(k=0;k<2&&!err;k++){if(await isUsed(P[k].phone,P[k].email)||await MG.check('pallanguli',P[k].phone))err=t('eDup',k+1)}
 if(err){regBusy=false;$('rerr').textContent=err;return}
 var ids=[];for(k=0;k<2&&!err;k++){var rr=await MG.register('pallanguli',{name:P[k].name,mobile:P[k].phone,email:P[k].email,age:P[k].age,lang:L});if(rr.dup)err=t('eDup',k+1);else ids.push(rr.id)}
 if(err){regBusy=false;$('rerr').textContent=err;return}
 regs=P.map(function(p,i){return{id:Date.now().toString(36)+i+Math.random().toString(36).slice(2,6),ts:new Date().toISOString(),lang:L,name:p.name,age:p.age,phone:p.phone,email:p.email,status:'registered',seeds:0,years:0,split:'',final:0,cagr:0,div:false,mgId:ids[i]}});
 regs.forEach(function(r){rows.push(r);post(r)});saveRows();
 await claim(P[0]);await claim(P[1]);
 regBusy=false;names=[P[0].name,P[1].name];ages=[P[0].age,P[1].age];startGame();
}

/* ---------- board engine ---------- */
var POS=[[5,1],[5,2],[5,3],[5,4],[5,5],[4,5],[2,5],[1,5],[1,4],[1,3],[1,2],[1,1],[2,1],[4,1]];
var SIDE=[[0,1,2,3,4,5,13],[6,7,8,9,10,11,12]];
var own=function(i){return (i<=5||i===13)?0:1};
var s=[],kind=[],store=[0,0],cur=0,busy=false,names=['',''],pits=[],ov=[],hd=null,rnd=1,quiet=0,earned=[0,0];
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
function el(tag,c){var e=document.createElement(tag);if(c)e.className=c;return e}
function buildBoard(){
 var b=$('board');b.innerHTML='';pits=[];
 POS.forEach(function(p,i){var e=el('button','pit');e.type='button';e.style.gridRow=p[0];e.style.gridColumn=p[1];e.addEventListener('click',function(){tap(i)});b.appendChild(e);pits[i]=e});
 var o2=el('div','pit oval');o2.style.gridRow=2;var o1=el('div','pit oval');o1.style.gridRow=4;
 var h=el('div','hinge');b.appendChild(o2);b.appendChild(h);b.appendChild(o1);ov=[o1,o2];
 hd=el('div','hand');hd.innerHTML='<span aria-hidden="true">✋</span><b>0</b>';b.appendChild(hd);
}
function sideSum(k){var x=0;for(var i=0;i<14;i++)if(own(i)===k)x+=s[i];return x}
function playable(k){var x=0;for(var i=0;i<14;i++)if(own(i)===k&&kind[i]===0)x+=s[i];return x}
function nextAllowed(p,pl){for(var j=0;j<14;j++){p=(p+1)%14;if(kind[p]===0||(kind[p]===1&&own(p)===pl))return p}return p}
function render(){
 for(var i=0;i<14;i++){
  var e=pits[i],n=s[i],h='';
  for(var j=0;j<Math.min(n,12);j++)h+='<i class="seed"></i>';
  e.innerHTML=h+(n?'<span class="cnt">'+n+'</span>':'')+(kind[i]===1?'<span class="lbl">'+esc(t('bank'))+'</span>':'');
  var can=!busy&&kind[i]===0&&own(i)===cur&&n>0;
  e.classList.toggle('can',can);e.classList.toggle('bank',kind[i]===1);e.classList.toggle('sealed',kind[i]===2);e.disabled=!can;
  e.setAttribute('aria-label',n+' '+t('seedsWord'));
 }
 for(var k=0;k<2;k++){var ps='';for(var q=0;q<Math.min(store[k],120);q++)ps+='<i class="seed"></i>';ov[k].innerHTML='<div class="pile">'+ps+'</div><small>'+esc(t('vault',names[k]))+'</small><b>'+store[k]+'</b>'}
 $('turn').textContent=t('turnOf',names[cur]);
 $('t1').textContent=t('seedsLine',names[0],store[0]+sideSum(0),names[1],store[1]+sideSum(1));
 $('rl').textContent=t('round',rnd);
}
function moveHand(i){var p=pits[i];hd.style.opacity=1;hd.style.transform='translate('+(p.offsetLeft+p.offsetWidth/2-19)+'px,'+(p.offsetTop+p.offsetHeight/2-19)+'px)'}
function setHand(n){hd.querySelector('b').textContent=n}
function hideHand(){hd.style.opacity=0}
function startGame(){
 s=[];kind=[];for(var i=0;i<14;i++){s.push(5);kind.push(0)}
 store=[0,0];sips=[[],[]];cur=0;busy=false;rnd=1;quiet=0;
 buildBoard();$('w1').textContent='🐻 '+names[0];$('w2').textContent='🐂 '+names[1];$('top').textContent=t('pTop');$('bot').textContent=t('pBot');
 $('msg').textContent='';show('s2');render();
}
async function tap(i){
 if(busy||kind[i]!==0||own(i)!==cur||!s[i])return;
 busy=true;$('msg').textContent='';
 var hand=s[i],pos=i,note=[],guard=0,before=store[0]+store[1];s[i]=0;render();
 hd.style.transition='opacity .2s';moveHand(i);setHand(hand);await sleep(60);hd.style.transition='transform .3s ease,opacity .2s';await sleep(500);
 while(true){
  while(hand>0){pos=nextAllowed(pos,cur);moveHand(pos);await sleep(340);s[pos]++;hand--;setHand(hand);render();await sleep(220);
   if(kind[pos]===0&&s[pos]===4){var po=own(pos);store[po]+=4;credit(po,4);s[pos]=0;note.push(t('pasu',names[po]));render();await sleep(450)}}
  var n=nextAllowed(pos,cur);
  if(kind[n]===0&&s[n]>0&&++guard<200){moveHand(n);await sleep(340);hand=s[n];s[n]=0;setHand(hand);render();await sleep(400);pos=n;continue}
  if(kind[n]===0){var c=nextAllowed(n,cur);
   if(kind[c]===0&&s[c]>0){moveHand(c);await sleep(450);var g=s[c];store[cur]+=g;credit(cur,g);s[c]=0;render();note.push(t('takes',names[cur],g))}
   else note.push(t('none'))}
  else note.push(t('none'));
  break;
 }
 hideHand();
 if(store[0]+store[1]===before)quiet++;else quiet=0;
 var stuck=quiet>=60;
 if(stuck||playable(0)===0||playable(1)===0){busy=false;return endRound(stuck)}
 cur=1-cur;busy=false;render();
 $('msg').textContent=(note.join(' ')+' '+t('wait',names[cur])).trim();
}
function endRound(stuck){
 var left=[0,0];for(var i=0;i<14;i++){if(s[i]>0){left[own(i)]+=s[i];s[i]=0}}
 for(var q=0;q<2;q++){store[q]+=left[q]}
 render();
 if(rnd===1){busy=true;render();$('msg').textContent=t('r2Go');setTimeout(function(){startRound2();if(rnd===2&&curStage==='s2')$('msg').textContent=t('r2Go')},1500);return}
 toInvest();
}
function startRound2(){
 rnd=2;quiet=0;sips=[[],[]];
 for(var i=0;i<14;i++){s[i]=0;kind[i]=2}
 for(var k=0;k<2;k++){
  var n=store[k],ord=SIDE[k],full=Math.min(7,Math.floor(n/5)),used=0,j;
  for(j=0;j<full;j++){s[ord[j]]=5;kind[ord[j]]=0;used+=5}
  if(full<7){var r=n-used;if(r>0){s[ord[full]]=r;kind[ord[full]]=1;used+=r}}
  store[k]=n-used;
 }
 cur=1;busy=false;buildBoard();$('w1').textContent='🐻 '+names[0];$('w2').textContent='🐂 '+names[1];$('top').textContent=t('pTop');$('bot').textContent=t('pBot');
 $('msg').textContent='';show('s2');render();
 if(playable(0)===0||playable(1)===0)endRound(false);
}

/* ---------- automatic investing (monthly SIP, round 2 only) and results ---------- */
/* Only seeds taken in round 2 are invested, each capture as its own monthly SIP of 1,000 per seed: 1-3 seeds -> Bank, 4 (and every pasu) -> NPS, 5-6 -> Mutual funds, 7 or more -> Stocks. */
var ASSETS=['aCash','aNps','aMf','aEq','aBond'],ASSET_EN=['Bank','NPS','Mutual funds','Stocks','Bonds'],RISK=[0,1,2,3,0.5],SEED=1000,ages=[0,0],sips=[[],[]];
/* Illustrative average yearly returns. */
var RATE=[6.25,8,11,12.5,7.25];
var inr=function(x){return '₹'+Math.round(x).toLocaleString('en-IN')};
function yearsFor(a){return a<50?50-a:10}
function assetOf(n){return n<=2?0:n===3?1:n===4?2:n<=6?3:4}
function credit(k,n){if(rnd!==2||n<=0)return;sips[k].push(n)}
function toInvest(){results()}
function fv(P,R,Y){var i=R/1200,m=Math.round(12*Y);return P<=0?0:P*((Math.pow(1+i,m)-1)/i)*(1+i)}
function growAll(P,Y){var x=0;for(var j=0;j<5;j++)x+=fv(P[j],RATE[j],Y);return x}
function annual(sumP,fin,Y){var m=Math.round(12*Y),lo=0,hi=0.05,i;for(var q=0;q<60;q++){i=(lo+hi)/2;var v=sumP*((Math.pow(1+i,m)-1)/i)*(1+i);if(v<fin)lo=i;else hi=i}return ((lo+hi)/2)*1200}
function calc(k){
 var Y=yearsFor(ages[k]),P=[0,0,0,0,0],sip=0,seeds=0,mx=0,top=0,rk=0,series=[],j,tt;
 var caps=sips[k].map(function(n){var a=assetOf(n),m=n*SEED;P[a]+=m;sip+=m;seeds+=n;rk+=m*RISK[a];return{n:n,a:a,m:m,put:m*12*Y,fin:fv(m,RATE[a],Y)}});
 for(j=0;j<5;j++)if(P[j]>mx){mx=P[j];top=j}
 for(tt=0;tt<=Y;tt++)series.push(growAll(P,tt));
 var fin=series[Y],put=sip*12*Y,ms=[];
 for(tt=5;tt<Y;tt+=5)ms.push(tt);ms.push(Y);
 return{k:k,name:names[k],age:ages[k],seeds:seeds,caps:caps,sip:sip,put:put,Y:Y,P:P,mx:mx,top:top,risk:rk/sip,fin:fin,early:growAll(P,Y+10),cagr:annual(sip,fin,Y),series:series,ms:ms};
}
function kinds(p){return{ty:p.risk<1.2?'Safe':p.risk<=2?'Bal':'Grow',hz:p.Y<=3?'hShort':p.Y<=7?'hMid':'hLong'}}
function bullets(p){
 var kd=kinds(p);
 return [t('seedsInv',p.seeds),p.age<50?t('ageLine',p.age,p.Y):t('yrsLine',p.Y),t('mixLine'),t('pri',t(ASSETS[p.top]),Math.round(p.mx/p.sip*100)),t('d'+kd.ty),t(kd.hz,p.Y)];
}
function compare(a,b){
 if(!a||!b)return [];
 var c=[];
 if(a.Y!==b.Y)c.push(t('cmp1',a.name,a.Y,b.name,b.Y));
 if(Math.round(a.sip)!==Math.round(b.sip))c.push(t('cmp2',a.name,inr(a.sip),b.name,inr(b.sip)));
 if(a.top!==b.top||Math.abs(a.mx/a.sip-b.mx/b.sip)>0.1)c.push(t('cmp3',a.name,Math.round(a.mx/a.sip*100),t(ASSETS[a.top]),b.name,Math.round(b.mx/b.sip*100),t(ASSETS[b.top])));
 c.push(t('cmp4',a.name,inr(a.fin),b.name,inr(b.fin)));
 return c;
}
function ulist(arr){return '<ul class="bl">'+arr.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'}
function whyList(){return [1,2,3,4,5].map(function(i){return t('why'+i)})}
function learnList(){return [1,2,3,4,5].map(function(i){return t('l'+i)})}
function contPoints(p){
 var out=[];
 if(p.Y>=10){
  var f5=p.series[5]-p.sip*60,l5=(p.series[p.Y]-p.series[p.Y-5])-p.sip*60;

  if(p.Y>10)out.push(t('cont2',inr(p.series[10]),p.Y,inr(p.fin)));
 }
 return out;
}
function report(p){
 var l=[t('repHead'),'',p.name+' ('+p.age+')',t('seedsInv',p.seeds),p.age<50?t('ageLine',p.age,p.Y):t('yrsLine',p.Y),''];
 [0,1,2,3,4].forEach(function(j){if(p.P[j]>0)l.push(t(ASSETS[j]),'  '+t('capA',inr(p.P[j]),p.Y),'  '+t('capB',inr(p.P[j]*12*p.Y),inr(fv(p.P[j],RATE[j],p.Y))),'')});
 l.push(t('totT'),t('totSip',inr(p.sip)),t('putL')+': '+inr(p.put),t('becL')+': '+inr(p.fin),t('gainL')+': '+inr(p.fin-p.put),t('roiL')+': '+MG.pct(p.put?(p.fin-p.put)/p.put*100:0),t('avgL')+': '+f(p.cagr)+'%','',t('note'));
 return l.join('\n');

function chart(list){
 var W=320,H=170,pl=44,pr=12,pt=12,pb=26,maxX=1,maxY=0,g='';
 list.forEach(function(p){maxX=Math.max(maxX,p.series.length-1);p.series.forEach(function(v){maxY=Math.max(maxY,v)})});maxY*=1.08;
 var X=function(i){return pl+(W-pl-pr)*i/maxX},Y=function(v){return H-pb-(H-pt-pb)*v/maxY};
 var fm=function(v){return v>=10000000?(v/10000000).toFixed(1)+'Cr':v>=100000?(v/100000).toFixed(1)+'L':Math.round(v/1000)+'k'};
 for(var q=0;q<=3;q++){var v=maxY*q/3,y=Y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="gl"/><text x="'+(pl-4)+'" y="'+(y+3).toFixed(1)+'" class="ax" text-anchor="end">'+fm(v)+'</text>'}
 g+='<text x="'+pl+'" y="'+(H-8)+'" class="ax">0</text><text x="'+(W-pr)+'" y="'+(H-8)+'" class="ax" text-anchor="end">'+maxX+' '+esc(t('yearsAx'))+'</text>';
 list.forEach(function(p){var pts=p.series.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ');var last=p.series.length-1;g+='<polyline points="'+pts+'" class="ln'+p.k+'"/><circle cx="'+X(last).toFixed(1)+'" cy="'+Y(p.series[last]).toFixed(1)+'" r="3.5" class="dt'+p.k+'"/>'});
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t('chartT'))+'">'+g+'</svg><div class="lg">'+list.map(function(p){return '<span><i class="sw sw'+p.k+'"></i>'+esc(p.name)+'</span>'}).join('')+'</div>';
}

 var live=P.filter(Boolean),w=null;

 }
 h+='<button class="main" id="again" type="button">'+esc(t('again'))+'</button><p class="mut s gap">'+esc(t('note'))+'</p>';
 $('s5').innerHTML=h;show('s5');

 live.forEach(function(p){

 });

async function adminList(){

 var lead=adminCache.filter(function(x){return x.r.status==='played'})[0];
 var h='<div class="card"><h2>Saved players ('+adminCache.length+')</h2>'
  +(lead?'<p><b>Prize leader: '+esc(lead.r.name)+' · '+lead.r.cagr+'% a year</b></p>':'<p class="mut">No player has finished yet.</p>')
  +'<div class="tw"><table><tr><th>Name</th><th>Age</th><th>Phone</th><th>Email</th><th>Status</th><th>Years</th><th>Round 2 monthly SIP split (₹)</th><th>Avg return %</th><th></th></tr>';
 adminCache.forEach(function(x,i){var r=x.r;h+='<tr><td>'+esc(r.name)+'</td><td>'+esc(r.age||'')+'</td><td>'+esc(r.phone)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.status)+'</td><td>'+(r.years||'')+'</td><td>'+esc(r.split||'')+'</td><td>'+(r.status==='played'?r.cagr:'')+'</td><td><button class="mini alt" type="button" data-a="del" data-i="'+i+'">Delete</button></td></tr>'});
 h+='</table></div><button class="main" type="button" data-a="csv">Download list (CSV)</button><button class="main alt" type="button" data-a="all" id="delAll">Delete all records</button><button class="main alt" type="button" data-a="close">Close</button></div>';
 $('adm').innerHTML=h;show('adm');
}
async function delEntry(x){
 var r=x.r;rows=rows.filter(function(y){return y.id!==r.id});saveRows();
 if(ENDPOINT)await sendSheet({a:'del',pin:sheetPin,id:r.id});
 if(dbRef){try{
  if(x.uid){var ref=dbRef.collection('players').doc(x.uid),sn=await ref.get(),v=sn.data();await ref.set({rows:((v&&v.rows)||[]).filter(function(y){return y.id!==r.id})})}
  await dbRef.doc('registry/p_'+await hash(r.phone)).delete();await dbRef.doc('registry/e_'+await hash(r.email)).delete();
 }catch(e){}}
}
async function delAll(){
 rows=[];saveLocal();
 if(ENDPOINT)await sendSheet({a:'delall',pin:sheetPin});
 if(dbRef){try{
  var q=await dbRef.collection('players').get();for(var i=0;i<q.docs.length;i++)await dbRef.collection('players').doc(q.docs[i].id).delete();
  var g=await dbRef.collection('registry').get();for(var j=0;j<g.docs.length;j++)await dbRef.collection('registry').doc(g.docs[j].id).delete();
 }catch(e){}}
}
async function saveFile(name,text){
 try{if(window.claude&&claude.use){var d=await claude.use('downloads');if(d){await d.save({filename:name,data:text});return}}}catch(e){}
 try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
}
$('adm').addEventListener('click',async function(e){
 var b=e.target.closest('button');if(!b)return;var a=b.getAttribute('data-a');
 if(a==='close'){show(prevStage==='adm'||prevStage==='gate'?'s1':prevStage)}
 else if(a==='del'){await delEntry(adminCache[parseInt(b.getAttribute('data-i'),10)]);showAdmin()}
 else if(a==='all'){if(!delAllArm){delAllArm=true;b.textContent='Tap again to delete everything'}else{await delAll();showAdmin()}}
 else if(a==='csv'){
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'};
  var c='Name,Age,Phone,Email,Status,Seeds,Years,Monthly SIP split Rs,Final Rs,Avg return %,Language,Time\n'+adminCache.map(function(x){var r=x.r;return [r.name,r.age,r.phone,r.email,r.status,r.seeds,r.years,r.split,r.final,r.cagr,r.lang,r.ts].map(q).join(',')}).join('\n');
  saveFile('pallanguli-players.csv',c);
 }
});
