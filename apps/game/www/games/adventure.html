<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Adventure · Mcube Games</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="stylesheet" href="../shared/mcube.css">
<script src="../shared/mcube.js"></script>
<style>
:root{--bg:#ffffff;--ink:#111827;--card:#ffffff;--line:#e5e7eb;--acc:#4F3CC9;--ok:#16a34a;--bad:#dc2626;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mg-font);min-height:100vh}
.wrap{padding:16px max(14px,env(safe-area-inset-right)) 28px max(14px,env(safe-area-inset-left))}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:1.6rem;text-align:center;margin:4px 0}h2{font-size:1.15rem;text-align:center;margin:10px 0}
.sub{text-align:center;margin:0 0 12px;opacity:.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{grid-template-columns:1fr 1fr 1fr}
.tile{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.tile:active{transform:scale(.96)}.tile:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tile .e{font-size:2.6rem;display:block}.tile b{display:block;font-size:.95rem;margin-top:2px}.tile small{display:block;opacity:.75;font-size:.75rem}
.chips{display:flex;gap:8px;justify-content:center;margin:8px 0 12px}
.chip{border:3px solid var(--line);background:var(--card);color:inherit;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:13px 30px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;margin-top:12px}
.scene{background:linear-gradient(#8fd3ff,#d8f3ff 60%,#b7e8a0 60%);border-radius:22px;border:3px solid var(--line);overflow:hidden}
svg{display:block;width:100%;height:auto}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.bal{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:6px 12px}
.card{background:var(--card);border:3px solid var(--line);border-left:8px solid var(--acc);border-radius:14px;padding:12px 14px;margin-top:10px;min-height:84px}
.card b{font-size:1.05rem}.card p{margin:4px 0 0}
.up{color:var(--ok)}.down{color:var(--bad)}
.center{text-align:center}.big{font-size:2.2rem;font-weight:800}
[hidden]{display:none!important}
#hv{animation:bob .5s infinite alternate}@keyframes bob{to{transform:translateY(-4px)}}
.chips .chip{padding:8px 12px}.quiz .chip{display:block;width:100%;margin:6px 0;text-align:left;border-radius:14px}.good{border-color:var(--ok)!important}.wrong{border-color:var(--bad)!important}.badges{margin-top:10px;font-weight:700}
.tile{border-width:1px;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:border-color .15s,box-shadow .15s}.tile:hover{border-color:var(--acc);box-shadow:0 6px 18px rgba(79,60,201,.12)}
.chip{border-width:1px}.chip:not(.on):hover{border-color:var(--acc)}
.card{border-width:1px;border-left-width:4px;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.bal{border-width:1px}
.scene{border-width:1px;width:min(100%,calc((100dvh - 250px)*.857));min-width:min(100%,280px);margin:0 auto}
h1{letter-spacing:-.01em}
@media (min-width:760px){.wrap{max-width:760px}.g3{grid-template-columns:repeat(6,1fr)}#avs{grid-template-columns:repeat(5,1fr)}.hud,.card{max-width:640px;margin-left:auto;margin-right:auto}}
@media (min-width:1200px){.wrap{max-width:960px}}
</style>
</head>
<body><script>MG.topbar("Money Adventure")</script><div class="wrap">

<section id="s1">
<h1>🌟 Money Adventure 🌟</h1>
<p class="sub">Step 1: Pick your hero!</p>
<div class="grid g3" id="heroes"></div>
</section>

<section id="s2" hidden>
<h1 id="hi"></h1>
<p class="sub">Step 2: How much money will you invest?</p>
<div class="chips" id="amts"></div>
<p class="sub">How many years?</p>
<div class="chips" id="yrs"></div>
<p class="sub">Step 3: Pick where to invest. Tap one!</p>
<div class="grid" id="avs"></div>
</section>

<section id="s3" hidden>
<div class="hud"><span id="who"></span><span class="bal" id="bal"></span></div>
<div class="scene"><svg viewBox="0 0 360 420" id="svg">
<text x="20" y="40" font-size="26">☁️</text><text x="285" y="70" font-size="26">☁️</text>
<path id="road" d="M50,385 C50,335 310,345 310,295 S50,245 50,195 S310,145 310,95 S150,55 180,28" fill="none" stroke="#b9772f" stroke-width="30" stroke-linecap="round"/>
<path d="M50,385 C50,335 310,345 310,295 S50,245 50,195 S310,145 310,95 S150,55 180,28" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
<g id="stops"></g>
<g id="hero" class="hero"><text id="hv" font-size="38" text-anchor="middle" dy="12"></text></g>
</svg></div>
<div class="card" id="ev"></div>
</section>

<section id="s4" hidden class="center">
<div class="big">🏆🎉</div>
<h1>Maturity reached!</h1>
<div class="card" id="res" style="text-align:left"></div>
<div class="card" id="chart"></div><div class="card quiz" id="quiz"></div><div class="badges" id="badges"></div>
<button class="btn" id="again">Play again 🔁</button>
</section>

<p class="sub" style="font-size:.75rem;margin-top:18px">A pretend game to learn. Returns shown are made-up examples, not real or guaranteed.</p>
</div>
<script>
const H=[["Bolt Boy","🦸"],["Zippy Bot","🤖"],["Tara Tiger","🐯"],["Luna Fairy","🧚"],["Chintu Monkey","🐵"],["Gajju Elephant","🐘"]];
const AV=[
["Mutual Funds","🧺",6,16,0,"Many people share one basket, and an expert looks after it. Great for steady growth."],
["Stock Market","📈",-8,24,0,"Prices jump up and down. Big wins are possible, and so are dips. Be patient!"],
["Fixed Deposit","🏦",7,7,1,"The bank promises the same interest every year. Safe and boring, like a sleepy turtle."],
["Gold","🥇",3,13,0,"Gold shines when others struggle. It grows slowly over many years."],
["Real Estate","🏠",3,12,0,"Houses and land grow in value, but they are hard to sell fast."],
["PPF","🐷",7.1,7.1,1,"The government keeps this piggy bank safe. You must wait 15 years in real life."],
["NPS","👴",6,13,0,"Money saved today becomes a pension for when you are old."],
["Govt Bonds","📜",7,7,1,"You lend money to the government and it pays you interest. Very safe."],
["Silver","🥈",-6,18,0,"Silver is used in gadgets, so its price moves quickly up and down."],
["ETF","🧩",-2,17,0,"A ready-made basket you buy like a share. Low cost and well spread."]];
const QZ=[["Who looks after a mutual fund?","A fund manager","A shopkeeper","A teacher"],["What do you own when you buy a share?","A tiny part of a company","A toy","A bank"],["Is the FD interest rate fixed?","Yes, it is fixed","No, it changes daily","FDs give no interest"],["Gold is often seen as...","Safe and shiny","Very cheap","Useless"],["Which one is real estate?","A house or land","A chocolate","A bicycle"],["Who backs the PPF?","The government","A circus","A toy shop"],["NPS is mainly for...","Retirement","Birthdays","Holidays"],["With a government bond you...","Lend money to the government","Win a prize","Buy a car"],["Silver prices...","Go up and down","Never change","Are always zero"],["An ETF is like...","A basket of investments","A single sweet","A game console"]];
let hero=0,amt=10000,yrs=5,av=0,busy=false,ac=null;
const $=i=>document.getElementById(i),fm=x=>"₹"+Math.round(x).toLocaleString("en-IN");
function snd(f,d=.15,t=0){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.15,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)}catch(e){}}
function show(n){["s1","s2","s3","s4"].forEach((s,i)=>$(s).hidden=i+1!==n);window.scrollTo(0,0)}
$("heroes").innerHTML=H.map((h,i)=>`<button class="tile" data-h="${i}"><span class="e">${h[1]}</span><b>${h[0]}</b></button>`).join("");
$("amts").innerHTML=[5000,10000,50000].map(a=>`<button class="chip${a===amt?" on":""}" data-a="${a}">${fm(a)}</button>`).join("");
$("yrs").innerHTML=[3,5,10].map(y=>`<button class="chip${y===yrs?" on":""}" data-y="${y}">${y} years</button>`).join("");
$("avs").innerHTML=AV.map((a,i)=>`<button class="tile" data-v="${i}"><span class="e">${a[1]}</span><b>${a[0]}</b><small>${a[4]?"Safe & steady":a[2]<0?"Risky, big swings":"Medium risk"}</small></button>`).join("");
let reg=null;
$("heroes").onclick=async e=>{const t=e.target.closest("[data-h]");if(!t)return;
  if(!reg){try{reg=(await MG.registerForm({game:"adventure",parent:true,gate:true,intro:"A parent or guardian registers once before the adventure starts."}))[0]}catch(x){return}}
  hero=+t.dataset.h;$("hi").textContent=H[hero][1]+" "+H[hero][0]+", let’s go!";show(2)};
function pick(box,key,set){$(box).onclick=e=>{const t=e.target.closest("[data-"+key+"]");if(!t)return;set(+t.dataset[key]);$(box).querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===t))}}
pick("amts","a",v=>amt=v);pick("yrs","y",v=>yrs=v);
$("avs").onclick=e=>{const t=e.target.closest("[data-v]");if(!t)return;av=+t.dataset.v;play()};
$("again").onclick=()=>{reg=null;show(1)};
const road=$("road"),L=road.getTotalLength();let pos=[];
const pt=l=>road.getPointAtLength(l);
function place(l){const p=pt(l);$("hero").setAttribute("transform",`translate(${p.x},${p.y-18})`)}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function move(a,b){return new Promise(r=>{const t0=performance.now(),d=yrs>5?900:1400;(function f(t){const p=Math.min((t-t0)/d,1);place(a+(b-a)*ease(p));p<1?requestAnimationFrame(f):r()})(t0)})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function choose(title,a,b){return new Promise(r=>{$("ev").innerHTML=`<b>${title}</b><div class="chips"><button class="chip" id="c0">${a}</button><button class="chip" id="c1">${b}</button></div>`;$("c0").onclick=()=>r(0);$("c1").onclick=()=>r(1)})}
function chart(h){const w=300,ht=110,mn=Math.min(...h),mx=Math.max(...h),sc=v=>ht-8-(v-mn)/((mx-mn)||1)*(ht-20),px=i=>10+i/(h.length-1)*(w-20);
  $("chart").innerHTML=`<b>📊 Your money over ${yrs} years</b><svg viewBox="0 0 ${w} ${ht}" style="margin-top:6px"><line x1="10" x2="${w-10}" y1="${sc(h[0])}" y2="${sc(h[0])}" stroke="#999" stroke-dasharray="4 4"/><polyline fill="none" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round" points="${h.map((v,i)=>px(i)+","+sc(v)).join(" ")}"/>${h.map((v,i)=>`<circle cx="${px(i)}" cy="${sc(v)}" r="4" fill="#7c3aed"/>`).join("")}</svg><small>Dashed line = money you started with</small>`}
function quiz(k,done){const q=QZ[k],o=q.slice(1).map((t,i)=>[t,i===0]).sort(()=>Math.random()-.5);
  $("quiz").innerHTML=`<b>🧠 Quiz time!</b><p>${q[0]}</p>`;
  o.forEach(([t,ok])=>{const b=document.createElement("button");b.className="chip";b.textContent=t;b.onclick=()=>{$("quiz").querySelectorAll("button").forEach(x=>x.disabled=true);b.classList.add(ok?"good":"wrong");snd(ok?880:200,.3);const m=document.createElement("p");m.textContent=ok?"⭐ Correct! You earned a star!":"Good try! The right answer was: "+q[1];$("quiz").appendChild(m);done(ok)};$("quiz").appendChild(b)})}
async function play(){
  if(busy)return;busy=true;snd(660);const A=AV[av],nm=H[hero][0];
  const c1=Math.ceil(yrs*.4),c2=Math.ceil(yrs*.8);let saver=0,patient=0,h=[amt];
  pos=Array.from({length:yrs+1},(_,i)=>i/yrs*L);
  $("hv").textContent=H[hero][1];$("who").textContent=H[hero][1]+" "+A[1]+" "+A[0];
  $("stops").innerHTML=pos.map((l,i)=>{const p=pt(l);return `<circle cx="${p.x}" cy="${p.y}" r="${yrs>5?11:15}" fill="#fff" stroke="#7c3aed" stroke-width="4"/><text x="${p.x}" y="${p.y}" font-size="${i==yrs||i==0?18:11}" font-weight="700" text-anchor="middle" dy="${i==yrs||i==0?6:4}" fill="#4c1d95">${i==0?"🏁":i==yrs?"🏆":"Y"+i}</text>`}).join("");
  let bal=amt;$("bal").textContent="💰 "+fm(bal);place(0);show(3);
  $("ev").innerHTML=`<b>${nm} starts with ${fm(amt)}!</b><p>Watch the journey and make smart choices. 🚶</p>`;
  await wait(1200);
  for(let y=1;y<=yrs;y++){
    await move(pos[y-1],pos[y]);
    const r=A[4]?A[2]:A[2]+Math.random()*(A[3]-A[2]);bal*=1+r/100;
    $("bal").textContent="💰 "+fm(bal);snd(r<0?220:880,.2);
    const msg=r<0?"⛈️ A storm! The value dipped a little. Stay calm.":r<5?"🐢 Slow and steady this year.":r<12?"☀️ Nice weather! Your money grew.":"🌈 Wow, a super year!";
    $("ev").innerHTML=`<b>Year ${y}: <span class="${r<0?"down":"up"}">${r>=0?"+":""}${r.toFixed(1)}%</span> → ${fm(bal)}</b><p>${msg}</p>`;
    await wait(1500);
    if(y===c1){
      const f=Math.random()<.5,x=amt*(f?.05:.1);
      const c=await choose(f?`🪙 ${nm} found ${fm(x)}! What now?`:`🎂 Birthday gift of ${fm(x)}! What now?`,"Invest it 🐷",f?"Buy candy 🍬":"Buy a toy 🧸");
      if(c===0){bal+=x;saver=1;snd(988);$("ev").innerHTML=`<b>Smart saver! 🐷</b><p>You added ${fm(x)} to your investment.</p>`}else $("ev").innerHTML=`<b>Yum! 😋</b><p>Fun now, but that money can’t grow.</p>`;
      $("bal").textContent="💰 "+fm(bal);await wait(1700);
    }
    if(y===c2){
      const c=await choose("😟 A friend says: “Take your money out now!”","Wait patiently 🐼","Take it out early 😬");
      if(c===0){patient=1;snd(988);$("ev").innerHTML=`<b>Patient Panda! 🐼</b><p>Waiting is how investors win.</p>`}else{bal*=.97;snd(200,.3);$("ev").innerHTML=`<b>Oops! 😬</b><p>Leaving early cost 3%. Patience pays.</p>`}
      $("bal").textContent="💰 "+fm(bal);await wait(1700);
    }
    h.push(bal);
  }
  const g=bal-amt;
  $("res").innerHTML=`<p>${H[hero][1]} <b>${nm}</b> invested in ${A[1]} <b>${A[0]}</b>.</p><p>Started with: <b>${fm(amt)}</b></p><p>After ${yrs} years: <b class="${g>=0?"up":"down"}">${fm(bal)}</b></p><p>${g>=0?"Gained":"Lost"}: <b class="${g>=0?"up":"down"}">${fm(Math.abs(g))}</b></p><p>💡 ${A[5]}</p>`;
  chart(h);$("badges").textContent="";
  const bd=[];if(patient)bd.push("🐼 Patient Panda");if(saver)bd.push("🐷 Super Saver");if(A[4])bd.push("🏦 Safe Saver");
  const det={hero:H[hero][0],avenue:A[0],amount:amt,years:yrs,final:Math.round(bal),gain:Math.round(g),badges:bd.join(", ")};
  MG.finish(reg&&reg.id,g>=0?"Gained":"Lost",Math.round(bal),det);
  quiz(av,ok=>{if(ok)bd.push("⭐ Quiz Star");$("badges").textContent=bd.length?"🏅 Badges: "+bd.join("  "):"";det.quiz=ok?"Correct":"Wrong";det.badges=bd.join(", ");MG.finish(reg&&reg.id,g>=0?"Gained":"Lost",Math.round(bal),det);});
  $("badges").textContent=bd.length?"🏅 Badges: "+bd.join("  "):"";
  show(4);[523,659,784,1047].forEach((f,i)=>snd(f,.25,i*.15));busy=false;
}
</script>
</body>
</html>
