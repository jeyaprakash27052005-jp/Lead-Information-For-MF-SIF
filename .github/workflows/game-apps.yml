name: Game apps (Windows, Mac, Android, iOS)

# Builds the Investment Business game for all four platforms.
# Run it from the Actions tab ("Run workflow"), or push a tag like game-v1.0.0
# to also publish a GitHub Release with every download attached.
on:
  workflow_dispatch:
  push:
    tags: ["game-v*"]
    paths: ["apps/game/**", ".github/workflows/game-apps.yml"]
    branches: ["**"]

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/game

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/game/package-lock.json }
      - run: npm ci
      - run: npm run build:win
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "apps/game/release/*.exe", if-no-files-found: error }

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/game/package-lock.json }
      - run: npm ci
      - run: npm run build:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "apps/game/release/*.dmg", if-no-files-found: error }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/game/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run android:add
      - name: Build APK (test install)
        run: cd android && ./gradlew assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../release-android-test.apk
      - name: Build signed APK and AAB for Play Store (only if the keystore secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > release.keystore
          npx cap build android --keystorepath "$PWD/release.keystore" --keystorepass "$KS_PASS" --keystorealias "$KS_ALIAS" --keystorealiaspass "$KEY_PASS" --androidreleasetype APK
          npx cap build android --keystorepath "$PWD/release.keystore" --keystorepass "$KS_PASS" --keystorealias "$KS_ALIAS" --keystorealiaspass "$KEY_PASS" --androidreleasetype AAB
          find android/app/build/outputs -name "*release*.apk" -exec cp {} release-android.apk \;
          find android/app/build/outputs -name "*release*.aab" -exec cp {} release-android-playstore.aab \;
          rm release.keystore
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "apps/game/release-android*", if-no-files-found: error }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/game/package-lock.json }
      - run: npm ci
      - run: npm run ios:add
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload && cp -R ios-build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Investment-Business-ios-unsigned.ipa Payload
      - name: Zip the Xcode project (open on a Mac to sign and send to the App Store)
        run: zip -qr Investment-Business-ios-xcode-project.zip ios -x "ios/App/Pods/*"
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: "apps/game/Investment-Business-ios-*", if-no-files-found: error }

  # Puts every install file in its own folder with install steps:
  # Investment-Business-Downloads/1-Windows-Laptop, 2-Mac, 3-Android, 4-iPhone-iPad
  downloads:
    needs: [windows, mac, android, ios]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: apps/game/install }
      - uses: actions/download-artifact@v4
        with: { path: built }
      - name: Sort files into one folder per device
        run: |
          D=Investment-Business-Downloads
          cp -R apps/game/install "$D"
          cp built/windows/*.exe "$D/1-Windows-Laptop/"
          cp built/mac/*.dmg "$D/2-Mac/"
          if [ -f built/android/release-android.apk ]; then
            cp built/android/release-android.apk "$D/3-Android/Investment-Business-Android.apk"
          else
            cp built/android/release-android-test.apk "$D/3-Android/Investment-Business-Android.apk"
          fi
          if [ -f built/android/release-android-playstore.aab ]; then
            mkdir -p "$D/3-Android/for-Play-Store"
            cp built/android/release-android-playstore.aab "$D/3-Android/for-Play-Store/Investment-Business-PlayStore.aab"
          fi
          cp built/ios/* "$D/4-iPhone-iPad/"
          # Same file names every time, so the download links on the game website never change
          mkdir direct
          cp built/windows/*Setup*.exe direct/Investment-Business-Windows-Setup.exe
          cp built/windows/*Portable*.exe direct/Investment-Business-Windows-Portable.exe
          cp built/mac/*.dmg direct/Investment-Business-Mac.dmg
          cp "$D/3-Android/Investment-Business-Android.apk" direct/Investment-Business-Android.apk
          ls -la direct
          mkdir zips
          for f in "$D"/*/; do n=$(basename "$f"); (cd "$D" && zip -qr "../zips/Investment-Business-$n.zip" "$n" README.txt); done
          find "$D" -type f | sort
      - uses: actions/upload-artifact@v4
        with: { name: Investment-Business-Downloads, path: Investment-Business-Downloads, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: zips, path: zips, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: direct, path: direct, retention-days: 7 }

  # Public download links (no GitHub login needed), replaced by every successful build:
  #   https://github.com/<owner>/<repo>/releases/download/game-app/Investment-Business-Windows-Setup.exe  (and -Portable.exe, -Mac.dmg, -Android.apk)
  # The game website's Download page (apps/game/www/download.html) points at these.
  publish-downloads:
    needs: [downloads]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: { group: game-app-release, cancel-in-progress: false }
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: direct, path: direct }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: game-app
          name: Investment Business app (latest)
          make_latest: true
          overwrite_files: true
          files: direct/*
          body: |
            Latest Investment Business game installers. These links always give the newest version:
            - Windows laptop / PC (installer): Investment-Business-Windows-Setup.exe
            - Windows (no install): Investment-Business-Windows-Portable.exe
            - Mac: Investment-Business-Mac.dmg
            - Android: Investment-Business-Android.apk
            - iPhone / iPad: open the game website in Safari, then Share > Add to Home Screen.

  release:
    if: startsWith(github.ref, 'refs/tags/game-v')
    needs: [downloads]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: zips, path: zips }
      - uses: softprops/action-gh-release@v2
        with:
          name: Investment Business ${{ github.ref_name }}
          files: zips/*.zip
          body: |
            Download the zip for your device. Each one has the install file and HOW-TO-INSTALL.txt.
            - Windows laptop / PC: Investment-Business-1-Windows-Laptop.zip
            - Mac: Investment-Business-2-Mac.zip
            - Android: Investment-Business-3-Android.zip
            - iPhone / iPad: Investment-Business-4-iPhone-iPad.zip (install from the web link: Safari > Share > Add to Home Screen)
